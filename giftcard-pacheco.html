<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b207f">
<meta name="color-scheme" content="only light">
<title>Giftcard para Pacheco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --morado:#3b207f;      /* fondo principal */
    --profundo:#170048;    /* franja oscura bajo el arco */
    --lila:#7964ff;        /* botones */
    --turquesa:#1eebca;    /* acento */
    --verde-1:#e6fcec;     /* pantalla de éxito (verde clarito) */
    --verde-2:#d0f7da;
    --verde-3:#b6efc7;
    --verde:#1fb85a;
    --verde-texto:#0d4a2a;

    --giro:-90deg;  /* giro de /tarjeta.png — si queda al revés, cámbialo a 90deg */
    --ar:.63;       /* ancho/alto de la tarjeta ya girada (el JS lo ajusta solo) */
    --p:0;          /* progreso del arrastre 0 → 1 (lo maneja el JS) */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--profundo)}
  body{
    min-height:100vh;min-height:100dvh;
    font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color:#fff;
    overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
    -webkit-font-smoothing:antialiased;
  }
  .app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

  /* ---------- Parte morada ---------- */
  .hero{position:relative;flex:1;display:flex;flex-direction:column;background:var(--morado)}
  .hero::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(55% 40% at 50% 45%,rgba(121,100,255,.30),transparent 72%);
  }
  .top{position:relative;display:flex;align-items:center;padding:calc(16px + env(safe-area-inset-top)) 20px 4px}
  .logo{display:block;height:34px;width:auto;max-width:60vw;object-fit:contain}
  .logo-ph{display:inline-flex;align-items:center;height:34px;padding:0 12px;border:1.5px dashed rgba(255,255,255,.45);border-radius:10px;font:500 13px/1 ui-monospace,Menlo,monospace;color:rgba(255,255,255,.75)}

  /* ---------- Tarjeta flotando ---------- */
  .stage{
    --cw:clamp(150px,min(60vw,calc((100vh - 410px) * var(--ar))),260px);
    position:relative;z-index:30;flex:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:22px 0 4px;
  }
  @supports (height:100dvh){
    .stage{--cw:clamp(150px,min(60vw,calc((100dvh - 410px) * var(--ar))),260px)}
  }
  .float{animation:flotar 3.6s ease-in-out infinite}
  @keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}

  .card{
    position:relative;width:var(--cw);aspect-ratio:var(--ar);
    touch-action:none;cursor:grab;outline:none;
    -webkit-touch-callout:none;
    filter:drop-shadow(0 18px 26px rgba(9,0,34,.55));
    transition:filter .25s ease;
  }
  .card:active{cursor:grabbing}
  .card:focus-visible{outline:3px solid var(--turquesa);outline-offset:8px;border-radius:14px}
  .card.listo{filter:drop-shadow(0 18px 26px rgba(9,0,34,.55)) drop-shadow(0 0 18px rgba(30,235,202,.7))}
  .rot{
    position:absolute;left:50%;top:50%;
    width:calc(100% / var(--ar));height:calc(100% * var(--ar));
    transform:translate(-50%,-50%) rotate(var(--giro));
  }
  .card.derecha .rot{width:100%;height:100%;transform:translate(-50%,-50%)}
  .rot img{
    display:block;width:100%;height:100%;object-fit:contain;
    border-radius:calc(var(--cw) * .06);
    pointer-events:none;-webkit-user-drag:none;
  }
  .ground{
    display:block;width:calc(var(--cw) * .78);height:16px;margin-top:18px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(8,0,30,.65),transparent);
    opacity:calc(1 - var(--p));
    animation:sombra 3.6s ease-in-out infinite;
  }
  @keyframes sombra{0%,100%{transform:scale(1)}50%{transform:scale(.8,.75)}}
  .dragging .float,.dragging .ground,.sending .float,.sending .ground{animation-play-state:paused}
  .sending .ground{opacity:0;transition:opacity .2s}

  .hint{
    position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;padding:8px 0 2px;
    font:500 14px/1 'Barlow',sans-serif;letter-spacing:.02em;color:#cfc3ff;
    opacity:calc(1 - var(--p) * 1.6);transition:opacity .2s;
  }
  .chev{display:flex;flex-direction:column;align-items:center;padding-top:4px}
  .chev i{
    display:block;width:11px;height:11px;margin-top:-4px;
    border-top:2.5px solid var(--turquesa);border-left:2.5px solid var(--turquesa);border-radius:1px;
    transform:rotate(45deg);opacity:.15;animation:chev 1.6s ease-in-out infinite;
  }
  .chev i:nth-child(1){animation-delay:.3s}
  .chev i:nth-child(2){animation-delay:.15s}
  @keyframes chev{0%,100%{opacity:.15}35%{opacity:1}}

  /* ---------- Franja oscura + botón ---------- */
  .base{display:flex;flex-direction:column;align-items:center;background:var(--profundo)}
  .cap{display:block;width:100%;height:clamp(48px,18.3vw,130px);margin-top:-1px;fill:var(--morado)}
  .cta{
    margin-top:14px;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    width:min(calc(100% - 40px),360px);min-height:60px;padding:10px 10px 10px 22px;
    border:0;border-radius:18px;background:var(--lila);color:#fff;
    font:600 19px/1.15 'Barlow Semi Condensed','Barlow',sans-serif;text-align:left;
    box-shadow:0 12px 26px rgba(5,0,25,.35);cursor:pointer;
    transition:transform .15s ease;
  }
  .cta b{font-weight:700}
  .cta:active{transform:scale(.97)}
  .cta:focus-visible{outline:3px solid var(--turquesa);outline-offset:3px}
  .cta-ico{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:11px;background:#fff}
  .cta-ico svg{width:22px;height:22px;fill:none;stroke:#140e33;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-2.5px)}}
  .foot{width:100%;margin-top:26px}
  .wave{display:block;width:100%;height:clamp(18px,8.3vw,60px);margin-bottom:-1px;fill:#fff}
  .foot::after{content:"";display:block;height:calc(14px + env(safe-area-inset-bottom));background:#fff}

  /* ---------- Pantalla de éxito ---------- */
  .done{
    position:fixed;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px;
    background:radial-gradient(120% 75% at 50% 42%,var(--verde-1) 0%,var(--verde-2) 48%,var(--verde-3) 100%);
    visibility:hidden;
  }
  .done.on{visibility:visible}
  .check{width:132px;height:132px}
  .check svg{display:block;width:100%;height:100%;overflow:visible}
  .ring{fill:none;stroke:var(--verde);stroke-width:5;stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:327;transform:rotate(-90deg);transform-origin:60px 60px}
  .disc{fill:var(--verde);transform:scale(0);transform-origin:60px 60px}
  .tick{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
  .halo{fill:none;stroke:var(--verde);stroke-width:3;opacity:0;transform-origin:60px 60px}
  .msg{
    font:700 clamp(30px,8.6vw,44px)/1.06 'Barlow',sans-serif;color:var(--verde-texto);
    text-align:center;text-wrap:balance;max-width:13ch;
    opacity:0;transform:translateY(14px);outline:none;
  }
  .done.play .ring{animation:trazo .55s cubic-bezier(.65,0,.45,1) forwards}
  .done.play .disc{animation:pop .5s cubic-bezier(.34,1.56,.64,1) .42s forwards}
  .done.play .tick{animation:trazo .4s cubic-bezier(.65,0,.45,1) .68s forwards}
  .done.play .halo{animation:halo 1.1s ease-out .72s forwards}
  .done.play .msg{animation:subir .6s cubic-bezier(.2,.8,.2,1) .86s forwards}
  @keyframes trazo{to{stroke-dashoffset:0}}
  @keyframes pop{to{transform:scale(1)}}
  @keyframes halo{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
  @keyframes subir{to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){
    .float,.ground,.chev i,.cta-ico svg{animation:none!important}
    .chev i{opacity:.7}
    .done.play .ring,.done.play .disc,.done.play .tick,.done.play .msg{animation-duration:.2s!important;animation-delay:0s!important}
    .done.play .halo{animation:none!important}
  }
</style>
</head>
<body>
<main class="app">
  <section class="hero">
    <header class="top">
      <img class="logo" id="logo" src="/mindy.png" alt="Mindy">
    </header>

    <div class="stage">
      <div class="float">
        <div class="card" id="card" tabindex="0" role="button"
             aria-label="Desliza la giftcard hacia arriba para enviarla a Pacheco">
          <div class="rot"><img id="tarjeta" src="/tarjeta.png" alt="" draggable="false"></div>
        </div>
      </div>
      <span class="ground" aria-hidden="true"></span>
    </div>

    <p class="hint" aria-hidden="true">
      <span class="chev"><i></i><i></i><i></i></span>
      Desliza hacia arriba
    </p>
  </section>

  <section class="base">
    <svg class="cap" viewBox="0 0 720 132" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0H720A557 557 0 0 1 0 0Z"/></svg>
    <button class="cta" id="enviar" type="button">
      <span>Enviar giftcard a <b>Pacheco</b></span>
      <span class="cta-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 14.5l6-6 6 6"/></svg></span>
    </button>
    <div class="foot" aria-hidden="true">
      <svg class="wave" viewBox="0 0 720 60" preserveAspectRatio="none"><path d="M0 60V47C15 33 36 25 70 21C140 12 240 9 360 13C470 17 540 22 600 20C650 18 690 12 720 0V60Z"/></svg>
    </div>
  </section>
</main>

<div class="done" id="listo" aria-hidden="true">
  <div class="check">
    <svg viewBox="0 0 120 120">
      <circle class="halo" cx="60" cy="60" r="52"/>
      <circle class="ring" cx="60" cy="60" r="52"/>
      <circle class="disc" cx="60" cy="60" r="52"/>
      <path class="tick" d="M37.5 61.5l15 15 30.5-31.5" pathLength="1"/>
    </svg>
  </div>
  <p class="msg" id="msg" tabindex="-1">Giftcard enviada a Pacheco</p>
</div>

<script>
(() => {
  const root = document.documentElement;
  const body = document.body;
  const card = document.getElementById('card');
  const img = document.getElementById('tarjeta');
  const logo = document.getElementById('logo');
  const boton = document.getElementById('enviar');
  const listo = document.getElementById('listo');
  const msg = document.getElementById('msg');
  const theme = document.querySelector('meta[name="theme-color"]');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- Tarjeta: se adapta a la proporción real de /tarjeta.png ---- */
  function ajustar() {
    const w = img.naturalWidth, h = img.naturalHeight;
    if (!w || !h) return;
    const horizontal = w >= h;
    root.style.setProperty('--ar', (horizontal ? h / w : w / h).toFixed(4));
    card.classList.toggle('derecha', !horizontal);
  }
  // Si /tarjeta.png no está (por ejemplo en la vista previa), se muestra una de muestra
  const muestra = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="856" height="540" viewBox="0 0 856 540">' +
    '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7964ff"/><stop offset="1" stop-color="#1eebca"/></linearGradient></defs>' +
    '<rect width="856" height="540" rx="36" fill="url(#g)"/>' +
    '<circle cx="770" cy="70" r="190" fill="#fff" fill-opacity=".12"/><circle cx="90" cy="560" r="230" fill="#fff" fill-opacity=".08"/>' +
    '<g fill="none" stroke="#fff" stroke-width="10" stroke-linejoin="round"><rect x="62" y="70" width="96" height="74" rx="8"/><path d="M110 70v74M62 100h96"/></g>' +
    '<text x="62" y="300" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="700" fill="#fff">GIFTCARD</text>' +
    '<text x="62" y="470" font-family="Menlo, monospace" font-size="30" fill="#fff" fill-opacity=".85">/tarjeta.png</text></svg>');
  const sinTarjeta = () => { img.src = muestra; };
  img.addEventListener('load', ajustar);
  img.addEventListener('error', sinTarjeta, { once: true });
  if (img.complete) img.naturalWidth ? ajustar() : sinTarjeta();

  /* ---- Logo ---- */
  const sinLogo = () => {
    if (!logo.isConnected) return;
    const s = document.createElement('span');
    s.className = 'logo-ph';
    s.textContent = 'mindy.png';
    logo.replaceWith(s);
  };
  logo.addEventListener('error', sinLogo, { once: true });
  if (logo.complete && !logo.naturalWidth) sinLogo();

  /* ---- Arrastre hacia arriba ---- */
  let estado = 'quieto';            // quieto | arrastrando | enviando | enviado
  let id = null, y0 = 0, dy = 0, yPrev = 0, tPrev = 0, t0 = 0, vel = 0, rebote = null;
  const umbral = () => Math.max(90, Math.min(160, innerHeight * 0.2));
  const progreso = () => Math.max(0, Math.min(1, -dy / umbral()));
  const vibrar = (patron) => {
    try {
      const activo = navigator.userActivation ? navigator.userActivation.hasBeenActive : true;
      if (activo && navigator.vibrate) navigator.vibrate(patron);
    } catch (_) {}
  };

  function mover(y) {
    dy = y;
    const p = progreso();
    card.style.transform = `translateY(${dy}px) scale(${1 + p * 0.04})`;
    root.style.setProperty('--p', p.toFixed(3));
    const ok = p >= 1;
    if (ok !== card.classList.contains('listo')) {
      card.classList.toggle('listo', ok);
      if (ok) vibrar(8);
    }
  }

  card.addEventListener('pointerdown', (e) => {
    if (estado !== 'quieto' || (e.pointerType === 'mouse' && e.button !== 0)) return;
    if (rebote) { rebote.cancel(); rebote = null; }
    estado = 'arrastrando';
    id = e.pointerId;
    try { card.setPointerCapture(id); } catch (_) {}
    y0 = yPrev = e.clientY; t0 = tPrev = e.timeStamp; vel = 0; dy = 0;
    card.style.transition = 'none';
    body.classList.add('dragging');
  });

  card.addEventListener('pointermove', (e) => {
    if (estado !== 'arrastrando' || e.pointerId !== id) return;
    const dt = e.timeStamp - tPrev;
    if (dt > 0) vel = 0.7 * ((e.clientY - yPrev) / dt) + 0.3 * vel;   // px/ms (negativo = hacia arriba)
    yPrev = e.clientY; tPrev = e.timeStamp;
    const raw = e.clientY - y0;
    mover(raw < 0 ? raw : raw * 0.25);                                  // hacia abajo casi no se mueve
  });

  function soltar(e) {
    if (estado !== 'arrastrando' || e.pointerId !== id) return;
    if (e.timeStamp - tPrev > 100) vel = 0;                             // se quedó quieto antes de soltar
    const lanzada = vel < -0.5 && dy < -30;
    if (e.type === 'pointerup' && (progreso() >= 1 || lanzada)) return enviar('swipe');
    volver(Math.abs(dy) < 6 && e.timeStamp - t0 < 300);
  }
  card.addEventListener('pointerup', soltar);
  card.addEventListener('pointercancel', soltar);
  card.addEventListener('contextmenu', (e) => e.preventDefault());

  function volver(fueToque) {
    estado = 'quieto';
    body.classList.remove('dragging');
    card.classList.remove('listo');
    root.style.setProperty('--p', 0);
    if (fueToque && !reduce) {
      // un toque: saltito para mostrar que se desliza hacia arriba
      card.style.transition = 'none';
      card.style.transform = '';
      rebote = card.animate([
        { transform: 'translateY(0)', easing: 'cubic-bezier(.25,.8,.35,1)' },
        { transform: 'translateY(-26px)', offset: .38, easing: 'cubic-bezier(.5,0,.4,1.4)' },
        { transform: 'translateY(0)' }
      ], { duration: 640 });
      rebote.onfinish = () => { rebote = null; };
      return;
    }
    card.style.transition = 'transform .55s cubic-bezier(.34,1.45,.64,1)';
    card.style.transform = '';
  }

  /* ---- Envío ---- */
  function enviar(origen) {
    if (estado === 'enviando' || estado === 'enviado') return;
    estado = 'enviando';
    if (rebote) { rebote.cancel(); rebote = null; }
    body.classList.add('sending');
    body.classList.remove('dragging');
    card.classList.remove('listo');
    boton.setAttribute('aria-disabled', 'true');

    const r = card.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    const salida = r.bottom + 80;                                       // distancia para salir por arriba
    const desde = `translateY(${dy}px) scale(${1 + progreso() * 0.04})`;
    card.style.transition = 'none';

    let vuelo, retraso;
    if (reduce) {
      vuelo = card.animate([{ transform: desde, opacity: 1 }, { transform: `translateY(${dy - 40}px)`, opacity: 0 }],
                           { duration: 220, fill: 'forwards' });
      retraso = 0;
    } else if (origen === 'swipe') {
      const v = -vel;
      const rapida = v > 0.8;
      vuelo = card.animate(
        [{ transform: desde }, { transform: `translateY(${dy - salida}px) scale(.9) rotate(-4deg)` }],
        {
          duration: rapida ? Math.max(220, Math.min(480, salida / Math.min(v, 3.5))) : 520,
          easing: rapida ? 'linear' : 'cubic-bezier(.45,0,.75,.35)',
          fill: 'forwards'
        });
      retraso = 70;
    } else {
      // botón o teclado: baja un poquito y despega
      vuelo = card.animate([
        { transform: 'translateY(0) scale(1)', easing: 'cubic-bezier(.33,0,.2,1)' },
        { transform: 'translateY(16px) scale(.97)', offset: .28, easing: 'cubic-bezier(.5,0,.8,.35)' },
        { transform: `translateY(${-salida}px) scale(.9) rotate(-4deg)` }
      ], { duration: 780, fill: 'forwards' });
      retraso = 220;
    }
    vuelo.onfinish = () => { card.style.visibility = 'hidden'; };
    setTimeout(() => revelar(cx, cy), retraso);
  }

  function revelar(x, y) {
    const W = innerWidth, H = innerHeight;
    const R = Math.ceil(Math.hypot(Math.max(x, W - x), Math.max(y, H - y))) + 8;
    listo.classList.add('on');
    listo.removeAttribute('aria-hidden');
    try {
      if (reduce) listo.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 250 });
      else listo.animate(
        [{ clipPath: `circle(0px at ${x}px ${y}px)` }, { clipPath: `circle(${R}px at ${x}px ${y}px)` }],
        { duration: 720, easing: 'cubic-bezier(.6,0,.3,1)' });
    } catch (_) {}
    if (theme) theme.setAttribute('content', '#d0f7da');
    setTimeout(() => { root.style.background = body.style.background = '#c9f4d5'; }, 760);
    setTimeout(() => {
      listo.classList.add('play');
      setTimeout(() => vibrar([16, 70, 26]), 700);
      setTimeout(() => {
        estado = 'enviado';
        try { msg.focus({ preventScroll: true }); } catch (_) {}
      }, 1000);
    }, reduce ? 40 : 330);
  }

  card.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (estado === 'quieto') enviar('tap');
    }
  });
  boton.addEventListener('click', () => { if (estado === 'quieto') enviar('tap'); });
})();
</script>
</body>
</html>
